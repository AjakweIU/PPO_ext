network:
  sources: 3
  sinks: 2
  pipeline_segments: 5
  compressors: 2
  time_steps_per_episode: 168

physical:
  min_pressure_pa: 4.0e6
  max_pressure_pa: 2.5e7
  source_capacity_tonnes_per_day: [1500.0, 2200.0, 2600.0]
  sink_capacity_tonnes_per_day: [2200.0, 3000.0]
  pipeline_lengths_km: [18.0, 24.0, 32.0, 20.0, 28.0]
  pipeline_diameters_m: [0.45, 0.50, 0.55, 0.60, 0.52]
  compressor_efficiency_range: [0.75, 0.88]
  compressor_design_efficiency: [0.82, 0.82]
  compressor_design_flow_tonnes_per_day: [1500.0, 1800.0]
  max_pressure_ratio: 2.2
  min_pressure_ratio: 1.0
  pipeline_roughness_m: 4.6e-5
  leakage_rate_range: [0.001, 0.02]

topology:
  type: documented_simplified_radial
  source_capacity_interpretation: network_total_distributed_by_configured_source_capacity_shares
  sink_demand_interpretation: network_total_distributed_by_configured_sink_capacity_shares
  segments:
    - {index: 0, name: source_1_feeder, from: source_1, to: compressor_1}
    - {index: 1, name: source_2_feeder, from: source_2, to: compressor_1}
    - {index: 2, name: source_3_feeder, from: source_3, to: compressor_2}
    - {index: 3, name: compressor_1_discharge, from: compressor_1, to: sink_1}
    - {index: 4, name: compressor_2_discharge, from: compressor_2, to: sink_2}
  compressor_source_groups:
    - {compressor: 0, sources: [0, 1], sink: 0}
    - {compressor: 1, sources: [2], sink: 1}
  compressor_action_semantics:
    control_0_per_compressor: pressure_ratio_request_mapped_from_action_0.75_1.25_to_configured_min_max_pressure_ratio
    control_1_per_compressor: design_flow_throttle_multiplier_clipped_to_0.75_1.25
  failure_policy:
    source_outage_probability: independent_per_source_at_reset
    compressor_outage_probability: independent_per_compressor_at_reset
    pipeline_outage_probability: failure_probability_divided_by_segment_count_per_segment_at_reset

